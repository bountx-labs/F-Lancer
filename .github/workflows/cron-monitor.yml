name: Cron Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        type: choice
        options:
          - monitor
          - setup
      dry_run:
        description: 'Dry run (no real LLM/Telegram)'
        required: false
        type: boolean
        default: false

concurrency:
  group: freelance-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: go build ./...

      - name: Run Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
          OPENCODE_ZEN_BASE_URL: ${{ secrets.OPENCODE_ZEN_BASE_URL }}
          KILO_GATEWAY_API_KEY: ${{ secrets.KILO_GATEWAY_API_KEY || secrets.KILO_API_KEY }}
          KILO_GATEWAY_BASE_URL: ${{ secrets.KILO_GATEWAY_BASE_URL }}
          MODE: ${{ inputs.mode || 'monitor' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: go run ./cmd/freelance-engine

      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_jobs.json profiles/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "chore: update state [skip ci]"
          if ! git push; then
            echo "::warning::State commit push failed - state stays in the working tree and will be committed on the next run"
          fi